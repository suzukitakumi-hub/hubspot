name: MBA reactivation monitor

on:
  schedule:
    # Every 15 minutes, offset from the USCPA monitor.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually update HubSpot / post Slack / append Sheets"
        required: true
        default: false
        type: boolean
      delivery:
        description: "Notification delivery mode"
        required: true
        default: slack
        type: choice
        options:
          - slack
          - hubspot
          - both
      lookback_hours:
        description: "HubSpot search lookback hours"
        required: true
        default: "6"
        type: string
      reactivation_days:
        description: "Minimum days since last contact"
        required: true
        default: "60"
        type: string
      limit_per_sender:
        description: "Max CRM email activities per allowed sender"
        required: true
        default: "200"
        type: string
      max_updates:
        description: "Safety cap for apply runs. 0 means unlimited."
        required: true
        default: "0"
        type: string
      sheet_output:
        description: "Append notification rows to Google Sheets"
        required: true
        default: true
        type: boolean
      sheet_setup_only:
        description: "Only ensure Google Sheets tabs, headers, and contact checkboxes"
        required: true
        default: false
        type: boolean
      slack_channel_id:
        description: "Override Slack channel ID for this run"
        required: false
        default: ""
        type: string

concurrency:
  group: mba-sales-email-open-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      MBA_SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id || vars.MBA_SLACK_CHANNEL_ID || secrets.MBA_SLACK_CHANNEL_ID || 'C0B9NLQTJA0' }}
      MBA_SHEET_SPREADSHEET_ID: 1pG1hTkFDuXfNheeixCQmuZ8s0uqSyvtuqt7ljZEEtvY
      LOOKBACK_HOURS: ${{ inputs.lookback_hours || '6' }}
      REACTIVATION_DAYS: ${{ inputs.reactivation_days || '60' }}
      LIMIT_PER_SENDER: ${{ inputs.limit_per_sender || '200' }}
      MAX_UPDATES: ${{ inputs.max_updates || '0' }}
      DELIVERY: ${{ inputs.delivery || 'slack' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-hubspot-course-update.txt

      - name: Install dependencies
        run: pip install -r requirements-hubspot-course-update.txt

      - name: Write Google service account JSON
        if: ${{ github.event_name == 'schedule' || inputs.sheet_output == true || inputs.sheet_setup_only == true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"

      - name: Run monitor
        id: monitor
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/google-service-account.json
        run: |
          args=(
            --lookback-hours "$LOOKBACK_HOURS"
            --reactivation-days "$REACTIVATION_DAYS"
            --limit-per-sender "$LIMIT_PER_SENDER"
            --delivery "$DELIVERY"
            --slack-channel-id "$MBA_SLACK_CHANNEL_ID"
            --max-updates "$MAX_UPDATES"
          )

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            args+=(--apply)
          fi

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.sheet_output }}" = "true" ]; then
            args+=(--sheet-output)
          fi

          if [ "${{ inputs.sheet_setup_only }}" = "true" ]; then
            args+=(--sheet-setup-only)
          fi

          python mba_sales_email_open_monitor.py "${args[@]}"

      - name: Upload monitor details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mba-sales-email-open-monitor-output
          path: outputs/mba_sales_email_open_monitor_*.json
          if-no-files-found: ignore
